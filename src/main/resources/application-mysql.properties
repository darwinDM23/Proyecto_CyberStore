# =========================================================
# Perfil "mysql": para desplegar en produccion (por ejemplo,
# Azure App Service + Azure Database for MySQL, Unidad 3 del silabo).
#
# Para activarlo:
#   java -jar cyberstore.jar --spring.profiles.active=mysql
# o definiendo la variable de entorno SPRING_PROFILES_ACTIVE=mysql
# =========================================================

spring.application.name=cyberstore

# Los valores reales se definen como variables de entorno en Azure App Service
# (Configuration > Application settings), nunca deben quedar escritos en el
# codigo fuente ni subirse al repositorio Git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cyberstore?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.thymeleaf.cache=true
spring.h2.console.enabled=false

server.port=${PORT:8080}
