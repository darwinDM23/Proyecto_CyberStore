# CiberStore - Perfil Azure MySQL

spring.datasource.url=jdbc:mysql://ciberstore-mysql.mysql.database.azure.com:3306/ciberstore?sslMode=REQUIRED
spring.datasource.username=ciberadmin
spring.datasource.password=${AZURE_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

server.port=8080