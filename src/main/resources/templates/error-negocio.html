<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Aviso')}"></head>
<body>
    <div th:replace="~{layout/fragments :: header}"></div>

    <main>
        <div class="mensaje-error" style="max-width:600px;">
            <h2>No se pudo completar la accion</h2>
            <p th:text="${mensaje}">Detalle del error</p>
        </div>
        <div style="text-align:center; margin: 20px 0;">
            <a class="btn" th:href="@{/}">Volver al inicio</a>
        </div>
    </main>

    <div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
