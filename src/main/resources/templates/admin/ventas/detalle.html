<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Detalle de venta')}"></head>
<body>
    <div th:replace="~{layout/fragments :: header}"></div>

    <main>
        <h1 class="titulo-seccion" th:text="'Venta N° ' + ${venta.id}">Venta</h1>

        <div class="content">
            <p><strong>Cliente:</strong> <span th:text="${venta.cliente.nombre}">Cliente</span></p>
            <p><strong>Correo:</strong> <span th:text="${venta.cliente.email}">correo</span></p>
            <p><strong>Fecha:</strong> <span th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</span></p>
            <p><strong>Estado:</strong> <span th:text="${venta.estado}">PAGADA</span></p>
        </div>

        <table class="carrito-tabla">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio unitario</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="detalle : ${venta.detalles}">
                    <td th:text="${detalle.producto.nombre}">Producto</td>
                    <td th:text="${detalle.cantidad}">1</td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(detalle.precioUnitario, 1, 2)}">S/ 0.00</td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(detalle.subtotal, 1, 2)}">S/ 0.00</td>
                </tr>
            </tbody>
        </table>

        <div class="carrito-resumen">
            <h2>Total: S/ <span th:text="${#numbers.formatDecimal(venta.total, 1, 2)}">0.00</span></h2>
        </div>

        <div style="text-align:center; margin: 20px 0;">
            <a class="btn" th:href="@{/admin/ventas}">Volver al listado</a>
        </div>
    </main>

    <div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
