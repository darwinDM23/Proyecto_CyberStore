<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(titulo='Ventas')}"></head>
<body>
    <div th:replace="~{layout/fragments :: header}"></div>

    <main>
        <h1 class="titulo-seccion">Ventas registradas</h1>

        <div class="admin-toolbar">
            <a class="btn" th:href="@{/admin/productos}">Volver a productos</a>
            <a class="btn" th:href="@{/admin/ventas/reporte}" target="_blank">
                Descargar reporte PDF (JasperReports)
            </a>
        </div>
        
        <form th:action="@{/admin/ventas}" method="get"
      style="display:flex; gap:10px; justify-content:center; margin:20px 0;">

    <input type="text"
           name="cliente"
           th:value="${cliente}"
           placeholder="Buscar por cliente"/>

    <button type="submit" class="btn">Buscar</button>

    <a class="btn" th:href="@{/admin/ventas}">Limpiar</a>
</form>
        <table class="admin-tabla">
            <thead>
                <tr>
                    <th>N° Venta</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Metodo de pago</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="venta : ${ventas}">
                    <td th:text="${venta.id}">1</td>
                    <td th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td th:text="${venta.cliente.nombre}">Cliente</td>
                    <td th:text="${venta.detalles.size()}">0</td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(venta.total, 1, 2)}">S/ 0.00</td>
                    <td th:text="${venta.estado}">PAGADA</td>
                    <td th:text="${venta.metodoPago != null ? venta.metodoPago : 'No registrado'}">
                      No registrado
                    </td>
                    <td><a class="btn btn-small" th:href="@{'/admin/ventas/' + ${venta.id}}">Ver</a></td>
                </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(ventas)}" style="text-align:center; padding:30px;">
            No se encontraron ventas.
        </p>
    </main>

    <div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
