<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${producto.id} != null ? 'Editar producto' : 'Nuevo producto')}"></head>
<body>
    <div th:replace="~{layout/fragments :: header}"></div>

    <main>
        <h1 class="titulo-seccion" th:text="${producto.id} != null ? 'Editar producto' : 'Nuevo producto'">Producto</h1>

        <form class="admin-form" th:action="@{/admin/productos/guardar}" method="post" th:object="${producto}">
            <input type="hidden" th:field="*{id}"/>

            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" required/>

            <label>Descripcion</label>
            <textarea th:field="*{descripcion}" rows="3"></textarea>

            <label>Precio (S/)</label>
            <input type="number" step="0.01" th:field="*{precio}" required/>

            <label>Stock</label>
            <input type="number" th:field="*{stock}" required/>

            <label>URL de imagen</label>
            <input type="text" th:field="*{imagenUrl}" placeholder="/img/productos/ejemplo.jpg"/>

            <label>Categoria</label>
            <select name="categoriaId" required>
                <option value="">-- Selecciona --</option>
                <option th:each="categoria : ${categorias}"
                        th:value="${categoria.id}"
                        th:text="${categoria.nombre}"
                        th:selected="${producto.categoria != null and producto.categoria.id == categoria.id}">
                </option>
            </select>

            <label>Marca (opcional)</label>
            <select name="marcaId">
                <option value="">-- Sin marca --</option>
                <option th:each="marca : ${marcas}"
                        th:value="${marca.id}"
                        th:text="${marca.nombre}"
                        th:selected="${producto.marca != null and producto.marca.id == marca.id}">
                </option>
            </select>

            <div style="text-align:center; margin-top:20px;">
                <button type="submit" class="btn">Guardar</button>
                <a class="btn btn-danger" th:href="@{/admin/productos}">Cancelar</a>
            </div>
        </form>
    </main>

    <div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
