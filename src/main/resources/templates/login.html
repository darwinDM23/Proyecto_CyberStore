<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(titulo='Iniciar sesión')}"></head>

<body>

    <div th:replace="~{layout/fragments :: header}"></div>

    <main>
        <section style="max-width: 420px; margin: 40px auto;">

            <h1 class="titulo-seccion">Iniciar sesión</h1>

            <div th:if="${param.error}"
                 style="background:#f8d7da; padding:10px; margin-bottom:15px; border-radius:6px;">
                Correo o contraseña incorrectos.
            </div>

            <div th:if="${param.logout}"
                 style="background:#d1e7dd; padding:10px; margin-bottom:15px; border-radius:6px;">
                Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post">

                <div style="margin-bottom:15px;">
                    <label for="username">Correo</label>
                    <input type="email"
                           id="username"
                           name="username"
                           required
                           style="width:100%; padding:10px;">
                </div>

                <div style="margin-bottom:15px;">
                    <label for="password">Contraseña</label>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           style="width:100%; padding:10px;">
                </div>

                <button type="submit" class="btn" style="width:100%;">
                    Ingresar
                </button>

            </form>

        </section>
    </main>

    <div th:replace="~{layout/fragments :: footer}"></div>

</body>
</html>
