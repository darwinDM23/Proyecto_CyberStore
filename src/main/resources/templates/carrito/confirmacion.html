<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Compra confirmada')}"></head>
<body>
    <div th:replace="~{layout/fragments :: header}"></div>

    <main>
        <div class="mensaje-exito">
            <h1>Gracias por tu compra, <span th:text="${venta.cliente.nombre}">Cliente</span>!</h1>
            <p>Numero de venta: <strong th:text="${venta.id}">0</strong></p>
            <p>Total pagado: S/ <strong th:text="${#numbers.formatDecimal(venta.total, 1, 2)}">0.00</strong></p>
            <p>Te enviaremos la confirmacion al correo <strong th:text="${venta.cliente.email}">correo</strong></p>
        </div>

        <table class="carrito-tabla">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio unitario</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="detalle : ${venta.detalles}">
                    <td th:text="${detalle.producto.nombre}">Producto</td>
                    <td th:text="${detalle.cantidad}">1</td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(detalle.precioUnitario, 1, 2)}">S/ 0.00</td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(detalle.subtotal, 1, 2)}">S/ 0.00</td>
                </tr>
            </tbody>
        </table>

        <div style="text-align:center; margin: 30px 0;">
            <a class="btn" th:href="@{/}">Seguir comprando</a>
        </div>
    </main>

    <div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
