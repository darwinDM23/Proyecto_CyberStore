<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Mi carrito')}"></head>
<body>
    <div th:replace="~{layout/fragments :: header}"></div>

    <main>
        <h1 class="titulo-seccion">Mi carrito de compras</h1>

        <p class="mensaje-error" th:if="${error != null}" th:text="${error}">Error</p>

        <div th:if="${carrito.vacio}" style="text-align:center; padding: 30px;">
            <p>Tu carrito esta vacio.</p>
            <a class="btn" th:href="@{/}">Ver productos</a>
        </div>

        <div th:unless="${carrito.vacio}">
            <table class="carrito-tabla">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio unitario</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${carrito.items}">
                        <td th:text="${item.producto.nombre}">Producto</td>
                        <td th:text="'S/ ' + ${#numbers.formatDecimal(item.producto.precio, 1, 2)}">S/ 0.00</td>
                        <td>
                            <form th:action="@{'/carrito/actualizar/' + ${item.producto.id}}" method="post"
                                  style="display:flex; gap:6px; justify-content:center;">
                                <input type="number" name="cantidad" th:value="${item.cantidad}" min="1"
                                       style="width:60px;"/>
                                <button type="submit" class="btn btn-small">Actualizar</button>
                            </form>
                        </td>
                        <td th:text="'S/ ' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">S/ 0.00</td>
                        <td>
                            <form th:action="@{'/carrito/eliminar/' + ${item.producto.id}}" method="post">
                                <button type="submit" class="btn btn-small btn-danger">Quitar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="carrito-resumen">
                <h2>Total: S/ <span th:text="${#numbers.formatDecimal(carrito.total, 1, 2)}">0.00</span></h2>
            </div>

            <form class="formulario-checkout" th:action="@{/carrito/confirmar}" method="post">
                <h2 style="text-align:center;">Datos para la compra</h2>
                <label>Nombre completo</label>
                <input type="text" name="nombre" required/>

                <label>Correo electronico</label>
                <input type="email" name="email" required/>

                <label>Telefono</label>
                <input type="text" name="telefono"/>

                <label>Direccion de entrega</label>
                <input type="text" name="direccion"/>

                <div style="text-align:center; margin-top:18px;">
                    <button type="submit" class="btn">Confirmar compra</button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
