# =========================================================
# CiberStore - configuracion por defecto (perfil: H2 en archivo)
# Pensada para desarrollo y para sustentar el proyecto sin
# necesidad de instalar un servidor de base de datos aparte.
# =========================================================

spring.application.name=cyberstore

# --- Base de datos H2 (archivo local, persiste entre ejecuciones) ---
spring.datasource.url=jdbc:h2:file:./data/cyberstore;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2, util para revisar las tablas generadas por Hibernate
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# update: crea/actualiza las tablas automaticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Subida de archivos (por si se agrega carga de imagenes mas adelante) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=8080
